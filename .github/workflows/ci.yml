name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            scripts/agent_server/requirements.txt
            requirements-dev.txt
      - name: Install server and test dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Check version and shell syntax
        run: |
          python scripts/validate_release.py
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          git diff --check
      - name: Run all repository tests
        run: python scripts/run_tests.py

  container:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radius-hermes:ci
          build-args: VCS_REF=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check image and discovery routes without external credentials
        run: |
          docker run --rm --entrypoint python -e HERMES_HOME=/tmp/hermes -e PUBLIC_URL=https://agent.example.com radius-hermes:ci /app/scripts/smoke_image.py
          docker run --rm --entrypoint cat radius-hermes:ci /app/build-info.json > build-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json

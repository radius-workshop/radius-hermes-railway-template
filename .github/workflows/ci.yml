name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

# A new push to a pull request replaces the run for the previous push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            scripts/agent_server/requirements.txt
            requirements-dev.txt
      - name: Install server and test dependencies
        run: |
          uv pip install --system -r requirements-dev.txt
          python -m pip check
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - name: Check version, shell syntax, and whitespace
        run: |
          python scripts/validate_release.py
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n
          git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Lint
        run: ruff check .
      - name: Run all repository tests
        run: python scripts/run_tests.py

  # Which pull request changes need the image built. Pushes to main and releases always do.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Skip the image build when only repo docs and PR tooling changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          image=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # Files that are not in the image and that no image test reads. README.md and HERMES.md
            # are copied into the image, so they are not on this list.
            docs='^(AGENTS\.md|CLAUDE\.md|CONTRIBUTING\.md|RELEASE\.md|RELEASE_NOTES\.md|\.claude/|tools/pr-checks/|\.github/pull_request_template\.md$|\.github/workflows/pr\.yml$)'
            files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)')
            if [[ -n "$files" ]] && ! grep -Evq "$docs" <<< "$files"; then image=false; fi
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  # Runs alongside tests, not after them: the two share nothing.
  container:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.image == 'true'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Resolve source revision
        id: source
        run: echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: radius-hermes:ci
          build-args: VCS_REF=${{ steps.source.outputs.revision }}
          cache-from: type=gha
          # Only main writes the layer cache; pull requests read it. Exporting it took up to 50 seconds per run.
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max' || '' }}
      - name: Check image and discovery routes without external credentials
        run: |
          docker run --rm --entrypoint python -e HERMES_HOME=/tmp/hermes -e PUBLIC_URL=https://agent.example.com radius-hermes:ci /app/scripts/smoke_image.py
          docker run --rm --entrypoint cat radius-hermes:ci /app/build-info.json > build-info.json
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.2
      - uses: helm/kind-action@v1
        with:
          version: v0.27.0
          cluster_name: hermes-chart
      - name: Install the Helm chart on kind and check it end to end
        run: BUILD=false IMAGE=radius-hermes:ci scripts/test_helm_chart.sh
      - uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: build-info.json

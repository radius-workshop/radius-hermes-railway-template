name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to validate and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Validate version, tag, and main history
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          python scripts/validate_release.py --tag "$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          git merge-base --is-ancestor HEAD origin/main
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.validate.outputs.tag }}

  publish:
    runs-on: ubuntu-latest
    needs: [validate, checks]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: build-info
          path: release-artifacts
      - name: Publish verified GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; verified checks completed."
          else
            args=(--verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md)
            if [[ "${RELEASE_TAG%%+*}" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" release-artifacts/build-info.json "${args[@]}"
          fi

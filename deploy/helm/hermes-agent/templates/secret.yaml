{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes.agentSecretName" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
type: Opaque
stringData:
  {{- include "hermes.envData" .Values.secrets.agent | trim | nindent 2 }}
{{- if .Values.egress.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes.egressSecretName" . }}
  labels:
    {{- include "hermes.labels" . | nindent 4 }}
    app.kubernetes.io/component: egress
type: Opaque
stringData:
  {{- include "hermes.envData" .Values.secrets.egress | trim | nindent 2 }}
{{- end }}
{{- end }}

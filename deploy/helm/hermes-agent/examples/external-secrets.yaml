# Secrets from any store supported by External Secrets Operator (Vault, AWS,
# GCP, Azure, 1Password, ...). The chart only needs a Secret named
# hermes-agent; the ExternalSecret below creates it. Assumes a ClusterSecretStore
# named "default" that you configured separately.
agent:
  existingSecret: hermes-agent
  config:
    SLACK_ALLOWED_USERS: U0123456789
ingress:
  enabled: true
  className: nginx
  host: agent.example.com
  tlsSecretName: hermes-agent-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
extraObjects:
  - apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: hermes-agent
    spec:
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: default
      target:
        name: hermes-agent
      dataFrom:
        - extract:
            key: hermes-agent   # one entry holding OPENROUTER_API_KEY, SLACK_BOT_TOKEN, SLACK_APP_TOKEN, ...
